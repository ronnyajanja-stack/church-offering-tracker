<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Church Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 p-6 text-white text-center">
      <h2 class="text-xl font-bold">Password Recovery</h2>
      <p class="text-indigo-100 text-xs mt-1">Enter your registered email to reset your password</p>
    </div>

    <form action="{{ url_for('forgot_password') }}" method="POST" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Registered Email</label>
        <input type="email" name="email" required placeholder="member@gmail.com" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition text-sm">
        Request Reset Link
      </button>

      <div class="text-center pt-2">
        <a href="{{ url_for('login') }}" class="text-xs text-indigo-600 hover:underline">← Back to Login</a>
      </div>
    </form>
  </div>

</body>
</html>
