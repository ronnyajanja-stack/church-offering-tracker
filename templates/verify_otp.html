<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email — Church Treasury Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans antialiased">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Card Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-7 text-center text-white">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 rounded-full mb-3 text-lg">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Verify Your Email</h1>
            <p class="text-xs text-indigo-100/90 mt-1">Enter the 6-digit verification code sent to:</p>
            <p class="text-xs font-semibold text-white mt-0.5 tracking-wide">{{ email }}</p>
        </div>

        <!-- Card Body -->
        <div class="p-8 space-y-5">
            <!-- Flash Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-3 text-xs rounded-lg border flex items-start gap-2 {% if category == 'error' %}bg-rose-50 border-rose-200 text-rose-700{% elif category == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-700{% else %}bg-blue-50 border-blue-200 text-blue-700{% endif %}">
                            <i class="fa-solid fa-circle-info mt-0.5"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('verify_otp') }}" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-2 text-center uppercase tracking-wider">
                        6-Digit Security Code
                    </label>
                    <input type="text" name="otp" maxlength="6" pattern="\d{6}" required autofocus 
                           placeholder="••••••"
                           class="w-full text-center tracking-[0.5em] text-2xl font-mono font-bold py-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition outline-none text-slate-900">
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2.5 px-4 rounded-lg shadow-md hover:shadow-indigo-500/25 transition text-sm flex items-center justify-center gap-2">
                    <span>Verify & Complete Registration</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
                <span>Didn't receive the code?</span>
                <a href="{{ url_for('resend_otp') }}" class="text-indigo-600 font-semibold hover:underline">
                    Resend Code
                </a>
            </div>
        </div>
    </div>

</body>
</html>
